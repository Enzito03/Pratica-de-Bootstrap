<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Planos de Serviço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center mb-5">Escolha seu Plano</h2>
        
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-header">
                        <h4>Básico</h4>
                    </div>
                    <div class="card-body">
                        <h2 class="card-title">R$ 29<small class="text-muted fs-6">/mês</small></h2>
                        <ul class="list-group list-group-flush mt-3 mb-4">
                            <li class="list-group-item">1 Usuário</li>
                            <li class="list-group-item">5GB de Armazenamento</li>
                            <li class="list-group-item">Suporte via Fórum</li>
                        </ul>
                        <button type="button" class="btn btn-outline-primary w-100">Assinar</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center border-primary">
                    <div class="card-header text-bg-primary">
                        <h4>Pro</h4>
                    </div>
                    <div class="card-body">
                        <h2 class="card-title">R$ 59<small class="text-muted fs-6">/mês</small></h2>
                        <ul class="list-group list-group-flush mt-3 mb-4">
                            <li class="list-group-item">Até 5 Usuários</li>
                            <li class="list-group-item">50GB de Armazenamento</li>
                            <li class="list-group-item">Suporte por Email</li>
                        </ul>
                        <button type="button" class="btn btn-primary w-100">Assinar</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-header">
                        <h4>Enterprise</h4>
                    </div>
                    <div class="card-body">
                        <h2 class="card-title">R$ 199<small class="text-muted fs-6">/mês</small></h2>
                        <ul class="list-group list-group-flush mt-3 mb-4">
                            <li class="list-group-item">Usuários Ilimitados</li>
                            <li class="list-group-item">Armazenamento Ilimitado</li>
                            <li class="list-group-item">Suporte 24/7</li>
                        </ul>
                        <button type="button" class="btn btn-outline-primary w-100">Assinar</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
